<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidemed - App</title>
    <style>
        :root {
            --bg-color: #f7f5f0;        /* Bege claro / off-white do site Sidemed */
            --card-bg: #ffffff;         /* Branco puro para os cards */
            --text-main: #1a1a1a;       /* Texto escuro principal */
            --text-muted: #666666;      /* Texto secundário */
            --primary-blue: #0052ff;    /* Azul vibrante dos botões */
            --primary-hover: #003eb3;
            --radius: 16px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .sidemed-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 16px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .sidemed-card h3 {
            margin-top: 0;
            font-size: 18px;
            color: var(--text-main);
        }

        .sidemed-card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .btn-sidemed {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 82, 255, 0.2);
            transition: background-color 0.2s ease;
            text-decoration: none;
            margin-top: 12px;
        }

        .btn-sidemed:active {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>sidemed.</h1>
            <p>Seu histórico de saúde sempre com você.</p>
        </div>

        <div class="sidemed-card">
            <h3>Painel de Acesso Rápido</h3>
            <p>Organize suas informações médicas, exames e dados essenciais em segundos.</p>
            <a href="dashboard.html" class="btn-sidemed">Acessar Dashboard</a>
        </div>

        <!-- Cartão com o Botão Funcional para Adicionar Widget -->
        <div class="sidemed-card">
            <h3>Atalho na Tela Inicial</h3>
            <p>Fixe um widget inteligente diretamente na tela inicial do seu celular para acesso instantâneo.</p>
            <button class="btn-sidemed" onclick="adicionarWidget()">
                ➕ Adicionar Widget
            </button>
        </div>
    </div>

    <script>
        function adicionarWidget() {
            // Comunicação via Bridge com o código nativo Java (MainActivity)
            if (window.Android && typeof window.Android.solicitarCriacaoWidget === 'function') {
                window.Android.solicitarCriacaoWidget();
            } else {
                alert("O recurso de widget está disponível apenas no aplicativo Android instalado.");
            }
        }
    </script>
</body>
</html>
