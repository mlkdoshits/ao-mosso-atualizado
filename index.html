<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Já pode ao mossar?</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 40px 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            overflow-x: hidden;
        }

        .placar-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .placar-box {
            background: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-width: 100px;
        }
        .placar-box h3 { margin: 0 0 5px 0; color: #777; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;}
        .placar-box span { font-size: 1.6rem; font-weight: bold; }
        #qtd-sim { color: #28a745; }
        #qtd-nao { color: #dc3545; }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            transition: transform 0.2s;
        }
        h1 { 
            font-size: 2.5rem; 
            color: #333; 
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            height: 110px; 
            position: relative;
        }
        button { 
            font-size: 1.5rem; 
            padding: 15px 35px; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: transform 0.1s; 
        }
        .sim { background: #28a745; }
        .sim:hover { transform: scale(1.1); background: #218838; }
        
        .nao { 
            background: #dc3545; 
            position: absolute;
            right: 40px; 
            transition: all 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            touch-action: none;
        }
        
        .sugestao-container {
            border-top: 1px solid #eee;
            padding-top: 25px;
            margin-top: 20px;
        }
        p { color: #666; font-size: 1.1rem; margin-bottom: 15px; }
        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            width: 140px;
            text-align: center;
            font-weight: bold;
        }
        .btn-relogio { background: #ff9f43; font-size: 1.1rem; padding: 12px 20px; }
        .btn-relogio:hover { background: #ee5253; }

        #status { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            color: #222; 
            font-weight: bold;
            min-height: 24px;
        }

        .celebrar {
            animation: puloFesta 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes puloFesta {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .tremer {
            animation: terremoto 0.1s ease-in-out infinite;
        }
        @keyframes terremoto {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(6px, -4px); }
            60% { transform: translate(-5px, -2px); }
            80% { transform: translate(7px, 3px); }
        }

        .emoji-voando {
            position: fixed;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 999;
        }
        
        @keyframes subirFesta {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
        }

        @keyframes cairTriste {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(115vh) rotate(-360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="placar-container">
        <div class="placar-box">
            <h3>Liberados 👍</h3>
            <span id="qtd-sim">0</span>
        </div>
        <div class="placar-box">
            <h3>Negados 👎</h3>
            <span id="qtd-nao">0</span>
        </div>
    </div>

    <div class="card" id="site-card">
        <h1>Já pode ao mossar? 🍽️</h1>
        
        <div class="btn-container" id="area-botoes">
            <div style="position: absolute; left: 40px;">
                <button class="sim" onclick="enviar('SIM')">Sim 👍</button>
            </div>
            <button class="nao" id="btn-nao">Não 👎</button>
        </div>

        <div class="sugestao-container">
            <p>Se não der para ao mossar agora, que horas vai ser o ao mosso?</p>
            <div class="input-group">
                <input type="text" id="horario-input" placeholder="00:00" maxlength="5">
                <button class="btn-relogio" onclick="enviarHorario()">Sugerir Horário do Ao Mosso ⏰</button>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const socket = io();
        const btnNao = document.getElementById('btn-nao');
        const areaBotoes = document.getElementById('area-botoes');
        const horarioInput = document.getElementById('horario-input');
        const card = document.getElementById('site-card');

        let contSim = 0;
        let contNao = 0;

        socket.on('nova-resposta', (data) => {
            if (data === 'SIM') {
                contSim++;
                document.getElementById('qtd-sim').innerText = contSim;
            } else if (data === 'NAO') {
                contNao++;
                document.getElementById('qtd-nao').innerText = contNao;
            }
        });

        horarioInput.addEventListener('input', (e) => {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.length > 2) {
                valor = valor.substring(0, 2) + ":" + valor.substring(2, 4);
            }
            e.target.value = valor;
        });

        function fugirDoAmigo(evento) {
            if(evento) evento.preventDefault();
            const larguraContainer = areaBotoes.offsetWidth - btnNao.offsetWidth;
            const alturaContainer = areaBotoes.offsetHeight - btnNao.offsetHeight;
            
            let novoX = Math.random() * larguraContainer;
            let novoY = Math.random() * alturaContainer;
            
            if (novoX < 160) {
                novoX = 160 + (Math.random() * (larguraContainer - 160));
            }
            
            btnNao.style.right = 'auto';
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';
        }

        btnNao.addEventListener('mouseover', fugirDoAmigo);
        btnNao.addEventListener('pointerdown', fugirDoAmigo);
        btnNao.addEventListener('touchstart', fugirDoAmigo);
        btnNao.addEventListener('click', (e) => {
            e.preventDefault();
            enviar('NAO');
        });

        function chuvaDeEmojis(listaEmojis, tipo) {
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const e = document.createElement('div');
                    e.classList.add('emoji-voando');
                    e.innerText = listaEmojis[Math.floor(Math.random() * listaEmojis.length)];
                    e.style.left = Math.random() * 100 + 'vw';
                    e.style.fontSize = (Math.random() * 1.5 + 1.5) + 'rem';
                    
                    if (tipo === 'SUBIR') {
                        e.style.bottom = '-50px';
                        e.style.animation = 'subirFesta ' + (Math.random() * 1 + 1) + 's cubic-bezier(0.1, 0.8, 0.3, 1) forwards';
                    } else {
                        e.style.top = '-50px';
                        e.style.animation = 'cairTriste ' + (Math.random() * 1.2 + 0.8) + 's linear forwards';
                    }
                    
                    document.body.appendChild(e);
                    setTimeout(() => e.remove(), 2000);
                }, i * 40);
            }
        }

        function enviar(resposta) {
            socket.emit('resposta', resposta);
            document.getElementById('status').innerText = "Você respondeu: " + resposta;
            
            card.className = 'card'; // Reseta as classes de animação anteriores com segurança
            void card.offsetWidth;
            
            if (resposta === 'SIM') {
                card.classList.add('celebrar');
                chuvaDeEmojis(['🎉', '🥳', '🍟', '🍕', '🍔', '🍗', '✨'], 'SUBIR');
            } else {
                card.classList.add('tremer');
                chuvaDeEmojis(['😭', '😢', '❌', '💔', '🫠'], 'CAIR');
                setTimeout(() => card.classList.remove('tremer'), 1000);
            }
            resgatarBotaoNao();
        }

        function enviarHorario() {
            const hora = horarioInput.value.trim();
            if(hora.length === 5) {
                socket.emit('resposta', 'HORARIO:' + hora);
                document.getElementById('status').innerText = "Horário do ao mosso enviado!";
