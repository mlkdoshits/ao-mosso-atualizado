<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Já pode ao mossar?</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 60px 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        h1 { 
            font-size: 2.5rem; 
            color: #333; 
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            height: 80px;
            align-items: center;
            position: relative;
        }
        button { 
            font-size: 1.5rem; 
            padding: 15px 30px; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: all 0.2s; 
        }
        .sim { background: #28a745; }
        .sim:hover { transform: scale(1.1); background: #218838; }
        
        .nao { 
            background: #dc3545; 
            position: absolute;
            left: 55%;
        }
        
        .sugestao-container {
            border-top: 1px solid #eee;
            padding-top: 25px;
            margin-top: 20px;
        }
        p { color: #666; font-size: 1.1rem; margin-bottom: 15px; }
        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            width: 120px;
            text-align: center;
        }
        .btn-relogio { background: #ff9f43; font-size: 1.1rem; padding: 12px 20px; }
        .btn-relogio:hover { background: #ee5253; }

        #status { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            color: #222; 
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Já pode ao mossar? 🍽️</h1>
        
        <div class="btn-container" id="area-botoes">
            <button class="sim" onclick="enviar('SIM')">Sim 👍</button>
            <button class="nao" id="btn-nao" onclick="enviar('NAO')">Não 👎</button>
        </div>

        <div class="sugestao-container">
            <p>Se não der para ao mossar agora, que horas vai ser o ao mosso?</p>
            <div class="input-group">
                <input type="text" id="horario-input" placeholder="Ex: 12:30">
                <button class="btn-relogio" onclick="enviarHorario()">Sugerir Horário do Ao Mosso ⏰</button>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const socket = io();
        const btnNao = document.getElementById('btn-nao');
        const areaBotoes = document.getElementById('area-botoes');

        btnNao.addEventListener('mouseover', () => {
            const larguraContainer = areaBotoes.offsetWidth - btnNao.offsetWidth;
            const novoX = Math.random() * larguraContainer;
            btnNao.style.left = novoX + 'px';
        });

        function enviar(resposta) {
            socket.emit('resposta', resposta);
            document.getElementById('status').innerText = "Você respondeu: " + resposta;
            btnNao.style.left = '55%';
        }

        function enviarHorario() {
            const hora = document.getElementById('horario-input').value.trim();
            if(hora) {
                socket.emit('resposta', 'HORARIO:' + hora);
                document.getElementById('status').innerText = "Horário do ao mosso enviado!";
                document.getElementById('horario-input').value = '';
            }
        }
    </script>
</body>
</html>
