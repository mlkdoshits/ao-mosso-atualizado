<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Já pode ao mossar?</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px 20px; 
            background: #f5f7fa; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .placar-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .placar-box {
            background: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-width: 100px;
        }
        .placar-box h3 { margin: 0 0 5px 0; color: #777; font-size: 0.8rem; text-transform: uppercase; }
        .placar-box span { font-size: 1.6rem; font-weight: bold; }
        #qtd-sim { color: #28a745; }
        #qtd-nao { color: #dc3545; }

        .card {
            background: white;
            padding: 30px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        
        /* ESTILO DA IMAGEM DO CACHORRINHO */
        .meme-img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            height: 110px; 
            position: relative;
        }
        button { 
            font-size: 1.5rem; 
            padding: 15px 35px; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .sim { background: #28a745; }
        
        .nao { 
            background: #dc3545; 
            position: absolute;
            right: 40px; 
            touch-action: none;
        }
        
        .sugestao-container {
            border-top: 1px solid #eee;
            padding-top: 25px;
            margin-top: 20px;
        }
        p { color: #666; font-size: 1.1rem; margin-bottom: 15px; }
        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            width: 140px;
            text-align: center;
            font-weight: bold;
        }
        .btn-relogio { background: #ff9f43; font-size: 1.1rem; padding: 12px 20px; }

        #status { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            color: #222; 
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="placar-container">
        <div class="placar-box">
            <h3>Liberados 👍</h3>
            <span id="qtd-sim">0</span>
        </div>
        <div class="placar-box">
            <h3>Negados 👎</h3>
            <span id="qtd-nao">0</span>
        </div>
    </div>

    <div class="card" id="site-card">
        <!-- IMAGEM DO MEME ADICIONADA AQUI -->
        <img src="cachorro.png" alt="Meme ao mosso" class="meme-img">
        
        <div class="btn-container" id="area-botoes">
            <div style="position: absolute; left: 40px;">
                <button class="sim" id="btn-sim-clique">Sim 👍</button>
            </div>
            <button class="nao" id="btn-nao">Não 👎</button>
        </div>

        <div class="sugestao-container">
            <p>Se não der para ao mossar agora, que horas vai ser o ao mosso?</p>
            <div class="input-group">
                <input type="text" id="horario-input" placeholder="00:00" maxlength="5">
                <button class="btn-relogio" id="btn-hora-clique">Sugerir Horário do Ao Mosso ⏰</button>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const socket = io();
        const btnSim = document.getElementById('btn-sim-clique');
        const btnNao = document.getElementById('btn-nao');
        const btnHora = document.getElementById('btn-hora-clique');
        const areaBotoes = document.getElementById('area-botoes');
        const horarioInput = document.getElementById('horario-input');

        let contSim = 0;
        let contNao = 0;

        socket.on('nova-resposta', (data) => {
            if (data === 'SIM') {
                contSim++;
                document.getElementById('qtd-sim').innerText = contSim;
            } else if (data === 'NAO') {
                contNao++;
                document.getElementById('qtd-nao').innerText = contNao;
            }
        });

        horarioInput.addEventListener('input', (e) => {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.length > 2) {
                valor = valor.substring(0, 2) + ":" + valor.substring(2, 4);
            }
            e.target.value = valor;
        });

        function fugirDoAmigo(evento) {
            if(evento) evento.preventDefault();
            const larguraContainer = areaBotoes.offsetWidth - btnNao.offsetWidth;
            const alturaContainer = areaBotoes.offsetHeight - btnNao.offsetHeight;
            
            let novoX = Math.random() * larguraContainer;
            let novoY = Math.random() * alturaContainer;
            
            if (novoX < 160) {
                novoX = 160 + (Math.random() * (larguraContainer - 160));
            }
            
            btnNao.style.right = 'auto';
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';
        }

        btnNao.addEventListener('mouseover', fugirDoAmigo);
        btnNao.addEventListener('pointerdown', fugirDoAmigo);
        btnNao.addEventListener('touchstart', fugirDoAmigo);

        btnSim.addEventListener('click', () => {
            socket.emit('resposta', 'SIM');
            document.getElementById('status').innerText = "Você respondeu: SIM";
            resgatarBotaoNao();
        });

        btnNao.addEventListener('click', (e) => {
            e.preventDefault();
            socket.emit('resposta', 'NAO');
            document.getElementById('status').innerText = "Você respondeu: NAO";
            resgatarBotaoNao();
        });

        btnHora.addEventListener('click', () => {
            const hora = horarioInput.value.trim();
            if(hora.length === 5) {
                socket.emit('resposta', 'HORARIO:' + hora);
                document.getElementById('status').innerText = "Horário do ao mosso enviado!";
                horarioInput.value = '';
                resgatarBotaoNao();
            } else {
                document.getElementById('status').innerText = "Insira o horário completo (Ex: 12:30)!";
            }
        });

        function resgatarBotaoNao() {
            btnNao.style.left = 'auto';
            btnNao.style.top = 'auto';
            btnNao.style.right = '40px';
        }
    </script>
</body>
</html>
