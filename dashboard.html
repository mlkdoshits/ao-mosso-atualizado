<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Ao Mosso</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { font-size: 1.2rem; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #ff4757; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff6b81; }
        #status { margin-top: 10px; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Enviar Notificação Personalizada</h2>
        <input type="text" id="tituloInput" placeholder="Título (ex: Qvs, esqueceu dus guri?)" value="Qvs, esqueceu dus guri?">
        <textarea id="corpoInput" rows="3" placeholder="Mensagem (ex: Libera o ao mosso aí)">Libera o ao mosso aí</textarea>
        <button onclick="enviarNotificacao()">Disparar Notificação</button>
        <div id="status"></div>
    </div>

    <script>
        async function enviarNotificacao() {
            const titulo = document.getElementById('tituloInput').value;
            const corpo = document.getElementById('corpoInput').value;
            const statusDiv = document.getElementById('status');

            statusDiv.style.color = '#ccc';
            statusDiv.innerText = 'A enviar...';

            try {
                // Codifica o texto para ser enviado de forma segura pela URL
                const url = `/api/agradecer?title=${encodeURIComponent(titulo)}&body=${encodeURIComponent(corpo)}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    statusDiv.style.color = '#2ed573';
                    statusDiv.innerText = 'Notificação enviada com sucesso!';
                } else {
                    statusDiv.style.color = '#ff4757';
                    statusDiv.innerText = 'Erro ao enviar.';
                }
            } catch (error) {
                statusDiv.style.color = '#ff4757';
                statusDiv.innerText = 'Erro de conexão com o servidor.';
            }
        }
    </script>

</body>
</html>
