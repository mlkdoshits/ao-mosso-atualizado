<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidemed - Dashboard</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --primary-blue: #0052ff;
            --primary-hover: #003eb3;
            --radius: 16px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-back {
            display: inline-block;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .sidemed-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 16px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #e0e0e0;
        }

        .profile-info h2 {
            margin: 0 0 4px 0;
            font-size: 18px;
        }

        .profile-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">← Voltar ao Início</a>

        <div class="sidemed-card">
            <div class="profile-header">
                <img src="cachorro.png" alt="Perfil" class="profile-avatar">
                <div class="profile-info">
                    <h2>Marina A. Costa</h2>
                    <p>Passaporte 100% completo</p>
                </div>
            </div>
        </div>

        <div class="sidemed-card">
            <h3 style="margin-top: 0; font-size: 16px;">Dados de Saúde</h3>
            <div class="info-row">
                <span class="info-label">Tipo Sanguíneo</span>
                <span class="info-value">O+</span>
            </div>
            <div class="info-row">
                <span class="info-label">Nascimento</span>
                <span class="info-value">14/03/1994</span>
            </div>
            <div class="info-row">
                <span class="info-label">Alergias</span>
                <span class="info-value" style="color: #e53935;">Nenhuma registrada</span>
            </div>
        </div>
    </div>

</body>
</html>
